name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test
      - run: make deb VERSION=${GITHUB_REF_NAME#v}
        if: startsWith(github.ref, 'refs/tags/v')
      - run: make deb VERSION=0.0.0~${GITHUB_SHA::7}
        if: "!startsWith(github.ref, 'refs/tags/v')"
      - uses: actions/upload-artifact@v7
        with: { name: deb, path: build/*.deb }

  image:
    needs: deb
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { arch: armhf, branch: master }  # Pi 1 to Pi 5
          - { arch: arm64, branch: arm64 }   # Pi 3 to Pi 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: deb }
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-qemu-action@v4
      - name: Build image
        run: |
          git clone --depth 1 -b ${{ matrix.branch }} https://github.com/RPi-Distro/pi-gen
          cp -r image/stage-usbip pi-gen/
          cp *.deb pi-gen/stage-usbip/00-install/files/usb-over-ip.deb
          touch pi-gen/stage2/SKIP_IMAGES
          cp image/config pi-gen/config
          echo "IMG_NAME=usb-over-ip-${{ matrix.arch }}" >> pi-gen/config
          cd pi-gen && ./build-docker.sh
          # pi-gen names its output image_<date>-<IMG_NAME>.img.xz; the release
          # assets need a stable name for releases/latest/download/ links
          mv deploy/*.img.xz ../usb-over-ip-${{ matrix.arch }}.img.xz
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: usb-over-ip-${{ matrix.arch }}.img.xz
          compression-level: 0

  release:
    needs: [deb, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { merge-multiple: true, path: dist }
      - name: Fill the Imager manifest with this release's sizes and checksums
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          m = json.loads(pathlib.Path("docs/usberrypi.rpi-imager-manifest").read_text())
          for e in m["os_list"]:
              f = pathlib.Path("dist") / e["url"].rsplit("/", 1)[1]
              e["image_download_size"] = f.stat().st_size
              # extract_* describe the uncompressed image: size from the xz index,
              # sha256 of the decompressed stream (what Imager verifies on write)
              listing = subprocess.run(["xz", "--robot", "--list", f], capture_output=True, text=True, check=True)
              e["extract_size"] = int(listing.stdout.splitlines()[-1].split("\t")[4])
              digest = subprocess.run(f"xz -dc {f} | sha256sum", shell=True, capture_output=True, text=True, check=True)
              e["extract_sha256"] = digest.stdout.split()[0]
          pathlib.Path("dist/usberrypi.rpi-imager-manifest").write_text(json.dumps(m, indent=2) + "\n")
          PY
      - uses: softprops/action-gh-release@v3
        with: { files: "dist/*", generate_release_notes: true }
